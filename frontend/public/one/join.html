<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Brand name, not translated copy — the same reasoning as task.html and settings.html. -->
<title>ONE Tasks</title>
<link rel="stylesheet" href="./one.css">
</head>
<!-- The invitation page (BRA-1475, rewriting BRA-1439 Story 5 in place — this is not a second
     page beside the old one).

     The invitation email links here as /one/join.html?i=<invitation_id>#signup_token=<token>.
     The handle is in the visible part of the address and the token is after the hash, so the
     token reaches no log: no browser transmits a fragment to any server.

     THIS PAGE DOES NOTHING ON ITS OWN WHEN IT LOADS. It reads whether anybody is signed in and
     asks the paid-account service what organisation and team the handle names. It never accepts,
     consumes or submits anything by itself — which is precisely what the page it replaces did,
     and why an administrator clicking an invitation they had just sent always failed.

     THE ROOT IS #auth, NOT #app, and the difference is load-bearing: app.js's boot()
     self-schedules on any document carrying #app, and this page must get join.js's own boot and
     nothing else. This is the same reason the previous version used #join.

     `hidden` is in the markup for settings.html's reason: a module that fails to load must leave
     an invisible page rather than a wrong one. -->
<body>
<div class="auth-stage hidden"><main class="auth-card" id="auth"></main></div>
<script type="module" src="./join.js"></script>
</body>
</html>
