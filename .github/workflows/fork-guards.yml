name: Fork guards

# Asserts that the deliberate removals made when this fork was baselined are still
# in place. An upstream merge can restore behaviour we removed on purpose, and
# without these checks nothing reports it: no error, no failing job, just our
# organization publishing container images again.
#
# See UPGRADING-FROM-UPSTREAM.md. These guards are the enforceable half of that
# document; the prose is the half that depends on someone remembering.

on:
  pull_request:
  merge_group:
  push:
    branches:
      - brazn/main

permissions:
  contents: read
  actions: read

concurrency:
  group: fork-guards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Fork guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the revision under test
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: No active workflow reaches the publishing path
        shell: bash
        run: |
          set -euo pipefail

          # ci.yml is the file BRA-774 removed the release job from. If an upstream
          # merge renames or moves it, every check below that assumed its contents
          # would pass while guarding nothing, so its absence is itself a finding.
          if [[ ! -f .github/workflows/ci.yml ]]; then
            echo "::error::.github/workflows/ci.yml is gone. An upstream change moved or" \
                 "renamed it, so the removals BRA-774 made cannot be verified. Re-point" \
                 "this guard before merging."
            exit 1
          fi

          failed=0

          # Route 1 — the reusable-workflow call. Upstream's release job authenticates
          # to ghcr.io as ${{ github.repository_owner }} with no upstream-repository
          # guard. Reached through `uses:` it runs inside the *caller's* run, so
          # disabling it at repository level does not stop it. Scanning every workflow,
          # not just ci.yml, because test.yml is already a reusable workflow ci.yml
          # calls and a call added there would be just as effective.
          calls="$(grep -rnE '^[[:space:]]*uses:.*(release|preview)\.ya?ml' \
            --include='*.yml' .github/workflows/ || true)"
          if [[ -n "${calls}" ]]; then
            echo "${calls}"
            echo "::error::A workflow calls release.yml or preview.yml again. An upstream" \
                 "merge reinstated the publishing path; on this fork it publishes container" \
                 "images under the Brazn name. Remove it before merging (CLAUDE.md section 2)."
            failed=1
          fi

          # Route 2 — the same hazard inlined or renamed. A release job whose steps are
          # pasted into ci.yml, or a release.yml renamed to publish.yml, defeats route 1
          # entirely. So look for the hazard itself: this repository authenticating to a
          # container registry. release.yml and preview.yml are excluded because they are
          # upstream's originals and are disabled at repository level (asserted in the
          # next step); fork-guards.yml is excluded because these patterns appear in it
          # only as the search terms on this line.
          offenders="$(grep -rlE 'docker/login-action|registry:[[:space:]]*ghcr\.io|packages:[[:space:]]*write' \
            --include='*.yml' \
            --exclude='release.yml' --exclude='preview.yml' --exclude='fork-guards.yml' \
            .github/workflows/ || true)"
          if [[ -n "${offenders}" ]]; then
            echo "${offenders}"
            echo "::error::The workflow file(s) above authenticate to a container registry." \
                 "Brazn Tasks images are built and promoted by the Percy container pipeline," \
                 "never by this repository. Remove the publishing steps before merging."
            failed=1
          fi

          if [[ "${failed}" == 0 ]]; then
            echo "No workflow calls or inlines the publishing path."
          fi
          exit "${failed}"

      - name: Inherited publishing workflows are still disabled
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Names as they appear in each workflow's own `name:` field.
          GUARDED: "Release,Preview"
        run: |
          set -euo pipefail
          workflows="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --paginate \
            --jq '.workflows[] | "\(.name)\t\(.state)"')"

          failed=0
          IFS=',' read -ra names <<< "${GUARDED}"
          for name in "${names[@]}"; do
            state="$(printf '%s\n' "${workflows}" \
              | awk -F'\t' -v n="${name}" '$1 == n { print $2; exit }')"
            if [[ -z "${state}" ]]; then
              # Absence is not safety. GitHub keys workflow records by path, so an
              # upstream rename retires the old record and registers a new one — and new
              # records default to `active`. Passing here on a missing name is exactly
              # the guard-that-stopped-looking this ticket exists to prevent.
              echo "::error::No workflow named '${name}' exists. It was disabled when this" \
                   "fork was baselined (BRA-774); an upstream change has renamed or removed" \
                   "it. Confirm the publishing path is still shut, then update GUARDED."
              failed=1
              continue
            fi
            if [[ "${state}" == active ]]; then
              echo "::error::Workflow '${name}' is active. It was disabled when this fork" \
                   "was baselined (BRA-774) because it publishes under the Brazn name." \
                   "Re-enabling needs an explicit decision recorded in a ticket."
              failed=1
            else
              echo "'${name}' is ${state}."
            fi
          done
          exit "${failed}"

      - name: The public v1 spec does not call the product Vikunja
        shell: bash
        run: |
          set -euo pipefail

          # pkg/swagger/ is generated by `mage generate:swagger-docs` from the
          # annotations in the Go sources, so a de-branding applied only to the
          # artifact regenerates away. BRA-926 fixed the annotations; this guard is
          # what reports it if an upstream merge or a regeneration brings the
          # product name back to /api/v1/docs, which is served to anyone.
          spec=pkg/swagger/swagger.json
          if [[ ! -f "${spec}" ]]; then
            echo "::error::${spec} is gone. An upstream change moved or renamed it, so" \
                 "the de-branding BRA-926 applied cannot be verified. Re-point this" \
                 "guard before merging."
            exit 1
          fi

          # Not every mention is a defect. These stay, deliberately:
          #   vikunja.io links + "fork of Vikunja"  — upstream attribution and the
          #     upstream documentation the fork still defers to (errors, filters,
          #     webhook signing). Accurate, and the AGPL notice depends on it.
          #   shared.VikunjaInfos, code_vikunja_io_* — schema and definition names in
          #     the API compatibility contract. Renaming them breaks generated clients.
          #   /migration/vikunja-file/, "Vikunja data export", "Vikunja export zip" —
          #     the migrator that reads Vikunja's own export format. The name of the
          #     thing being imported really is Vikunja.
          # Anything else is the product calling itself Vikunja, which is the defect.
          allowed='vikunja\.io|fork of Vikunja|upstream Vikunja documentation|shared\.VikunjaInfos|code_vikunja_io|/migration/vikunja-file/|Vikunja data export|Vikunja export zip'

          offenders="$(grep -oiE '.{0,60}vikunja.{0,60}' "${spec}" | grep -viE "${allowed}" || true)"
          if [[ -n "${offenders}" ]]; then
            echo "${offenders}"
            echo "::error::The context(s) above name Vikunja as the product in the public" \
                 "v1 API spec. Customer-facing text says ONE; only upstream" \
                 "references and API-contract identifiers keep the upstream name. Fix the" \
                 "Go annotation, not just pkg/swagger/, or it comes back on the next" \
                 "regeneration (BRA-926)."
            exit 1
          fi
          echo "Every Vikunja mention in ${spec} is an upstream reference or a contract identifier."

      - name: No translation catalogue calls the product or the subscription by a dead name
        shell: bash
        run: |
          set -euo pipefail

          # BRA-926 de-branded the email and UI catalogues in all 38 languages.
          # Translations sync from Crowdin, whose source strings are upstream's, so
          # a sync is a live route for "Welcome to Vikunja!" to come back — in a
          # language nobody here reads, in the first email a new customer receives.
          #
          # BRA-1444 added the superseded names. The product has been called three
          # things: Vikunja upstream, then Brazn Tasks, and now ONE. What a
          # customer buys has been called two: Percy Cloud, then Brazn Cloud, and
          # since 2026-08-27 it is "your ONE subscription" [Ruled, Sebastian]. The
          # Crowdin route above can only bring the upstream name back, but a
          # branch cut before a rename, a revert, or an upstream merge can bring
          # back any of the others, and those read as correct to anyone who has
          # not been told otherwise. This is what reports all of them.
          #
          # Only values are checked, never keys. open_vikunja, vikunja and
          # vikunjaFile are internal identifiers wired to call sites across both
          # catalogues; renaming them is churn in 76 files that no customer can see.
          #
          # Two allowances, and they are narrow on purpose:
          #   Vikunja export  the import picker naming the export format it reads,
          #     which really is Vikunja's.
          #   BraznMngo/brazn-tasks  the repository address in the "report this
          #     failure" string, in 16 languages. It is where a person actually
          #     goes; it is not the product naming itself. It is spelled with a
          #     hyphen and the product name with a space, so the pattern below
          #     already tells them apart -- this note exists so nobody "fixes"
          #     the URL to match the product.
          #
          # The names are searched in three separate greps, and this is not
          # tidiness. Each grep is the one that can acquire an allowance, and an
          # allowance on a shared line drops the whole line for every name on it.
          #
          # The "Vikunja export" allowance has to apply to the upstream name only:
          # the value it exists for is the import picker's, which reads "ONE /
          # Vikunja export", and if that regressed to "Brazn Tasks / Vikunja
          # export" then one grep with one allowance would drop the whole line and
          # report nothing. It was written that way first and missed exactly that.
          #
          # The dead names -- Brazn Tasks, Percy Cloud, Brazn Cloud -- are on their
          # own grep and will never carry an allowance, because nothing a customer
          # reads may name any of them again.
          #
          # Percy on its own is different, because it is a live name: it is the
          # assistant inside ONE, and "Percy posted for you" would be correct copy.
          # What is refused today is a catalogue value carrying it at all, because
          # today none does. When attribution copy lands, the allowance goes on
          # THIS grep and names the exact string -- and because "Percy Cloud" is
          # matched by the dead-names grep above, no allowance written here can let
          # the old subscription name back in. That is the whole reason the dead
          # names and the live one are not on the same grep.
          failed=0
          for dir in pkg/i18n/lang frontend/src/i18n/lang; do
            if [[ ! -d "${dir}" ]]; then
              echo "::error::${dir} is gone. Re-point this guard before merging."
              failed=1
              continue
            fi
            upstream="$(grep -rnE '":.*[Vv]ikunja' "${dir}" | grep -vF 'Vikunja export' || true)"
            superseded="$(grep -rnE '":.*([Bb]razn [Tt]asks|[Pp]ercy [Cc]loud|[Bb]razn [Cc]loud)' "${dir}" || true)"
            assistant="$(grep -rnE '":.*[Pp]ercy' "${dir}" | grep -viF 'percy cloud' || true)"
            hits="$(printf '%s\n%s\n%s' "${upstream}" "${superseded}" "${assistant}" | grep -v '^$' || true)"
            if [[ -n "${hits}" ]]; then
              echo "${hits}"
              failed=1
            fi
          done
          if [[ "${failed}" != 0 ]]; then
            echo "::error::The translated string(s) above name the product Vikunja," \
                 "Brazn Tasks or Percy, or the subscription Percy Cloud or Brazn Cloud." \
                 "Customer-facing copy says ONE in every language, and what a customer" \
                 "buys is \"your ONE subscription\" (BRA-1444); only upstream attribution" \
                 "and the Vikunja export format keep the upstream name. If this arrived" \
                 "from Crowdin, fix it there too or the next sync reverts it."
            exit 1
          fi
          echo "No catalogue value in either directory names the product or the subscription by a dead name."

      # ---------------------------------------------------------------------
      # BRA-1357 / BRA-1358 — the ONE Tasks restricted views.
      #
      # frontend/public/ is copied into dist/ verbatim by Vite (no publicDir
      # override in frontend/vite.config.ts) and embedded by frontend/embed.go,
      # so nothing between that directory and production compiles, lints or
      # type-checks the page: `pnpm lint` globs src/**, stylelint globs src/**,
      # and vue-tsc only sees what a test imports -- and frontend-typecheck runs
      # continue-on-error: true (test.yml:404) anyway. Nothing loads the page in
      # a browser either; there is deliberately no Playwright spec for it,
      # because the E2E environment is cross-origin (frontend :4173, API :3456,
      # VIKUNJA_CORS_ENABLE: 1) and this page only works same-origin.
      #
      # These four steps are therefore the only automated check in the
      # repository that ever looks at the page at all.
      #
      # Scope note, deliberate: every scan below is rooted at
      # frontend/public/one and never reads .github/, so unlike the steps above
      # none of them can match its own search terms in this file and no
      # --exclude='fork-guards.yml' is needed. If a later change broadens any of
      # these paths, re-add the exclusion at the same time.
      # ---------------------------------------------------------------------

      - name: The ONE Tasks page is present and parses
        shell: bash
        run: |
          set -euo pipefail

          dir=frontend/public/one
          if [[ ! -d "${dir}" ]]; then
            echo "::error::${dir} is gone. The ONE Tasks restricted views live there and" \
                 "nothing else in this repository parses them. Re-point this guard" \
                 "before merging."
            exit 1
          fi

          failed=0

          # Named, not globbed. A glob that matches nothing passes, which is the
          # exact failure this guard exists to prevent: a page half-deleted by a
          # bad merge would still be "valid JavaScript" in the checks below. This
          # list is the locked file layout from the brief. Modules reached only
          # at runtime (view-task.js, view-settings.js) are covered by the
          # specifier check further down instead, so they are not duplicated here.
          #
          # The .html documents are NOT listed here, deliberately (BRA-1475
          # criterion 18): they are named once, in the const block at the top of
          # pkg/routes/static_brazn.go, and the "Every ONE document is on the one
          # list" step below is what checks them against this directory. A second
          # copy of that list here would be a second place for it to be wrong.
          for f in one.css app.js api.js i18n.js \
                   i18n/en.json i18n/es-ES.json i18n/de-DE.json \
                   i18n/fr-FR.json i18n/zh-CN.json i18n/ja-JP.json \
                   logo-light.v1.png logo-dark.v1.png; do
            if [[ ! -f "${dir}/${f}" ]]; then
              echo "::error::${dir}/${f} is missing. The page cannot load without it."
              failed=1
            fi
          done

          # Node on ubuntu-24.04, stated honestly because `node --check` is the
          # only parser here: GitHub's ubuntu-24.04 image ships Node.js on PATH,
          # so no actions/setup-node step is required and none is added -- that
          # would cost ~15s on a job with a 5-minute budget that currently
          # installs nothing. The caveat is that the version floats with the
          # image; we pin nothing. Everything below relies only on `--check` and
          # on .mjs meaning ESM, both stable since Node 12, so the float is
          # acceptable. If a future guard here needs a specific language level,
          # add actions/setup-node with node-version-file: frontend/.nvmrc.
          #
          # `node --check` parses a .js file as CommonJS, and these are ES
          # modules, so checking them in place would fail on correct files.
          # Copying each to a .mjs outside the tree forces the ESM parser by
          # extension -- independent of the runner's Node version and of
          # frontend/package.json's "type": "module" staying where it is. Parse
          # only: nothing on this page is ever executed.
          if ! command -v node >/dev/null 2>&1; then
            echo "::error::node is not on PATH on this runner image. It is the parser this" \
                 "guard depends on, and without it the page ships unparsed. Add" \
                 "actions/setup-node with node-version-file: frontend/.nvmrc to this job."
            exit 1
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          while IFS= read -r js; do
            mjs="${tmp}/$(basename "${js}" .js).mjs"
            cp "${js}" "${mjs}"
            if ! node --check "${mjs}"; then
              echo "::error::${js} is not valid JavaScript. It is served to the browser" \
                   "byte-for-byte with no build step, so this is a blank page in production."
              failed=1
            fi
          done < <(find "${dir}" -type f -name '*.js')

          # --check proves a file parses; it never proves its specifiers
          # resolve. A typo'd relative import is a 404 at load time and a green
          # CI. Both forms are checked: `from './x.js'` and the dynamic
          # `import('./x.js')` that app.js uses to load the two view modules --
          # a static-only scan would miss exactly those two files.
          while IFS= read -r js; do
            while IFS= read -r spec; do
              if [[ ! -f "$(dirname "${js}")/${spec}" ]]; then
                echo "::error::${js} imports '${spec}', which does not exist. The browser" \
                     "resolves that against $(dirname "${js}")/ and gets a 404."
                failed=1
              fi
            done < <(grep -oE "(from[[:space:]]+|import[[:space:]]*\([[:space:]]*)['\"]\./[^'\"]+['\"]" "${js}" \
                     | sed -E "s/.*['\"](.*)['\"]/\1/" || true)
          done < <(find "${dir}" -type f -name '*.js')

          # The same hazard in the markup: task.html hand-writes its module
          # script tag and both logo <img>s as relative URLs, and nothing
          # rewrites them.
          while IFS= read -r ref; do
            if [[ ! -f "${dir}/${ref}" ]]; then
              echo "::error::${dir} markup references './${ref}', which does not exist."
              failed=1
            fi
          done < <(grep -ohE '(src|href)="\./[^"]+"' "${dir}"/*.html \
                   | sed -E 's/.*"\.\/(.*)"/\1/' | sort -u || true)

          # Every catalogue the page can negotiate to. The i18n fallback rule
          # covers a missing key; it does not cover a catalogue that fails to
          # parse, which takes the whole language down. jq is preinstalled on
          # the runner image, so JSON is validated by a parser rather than by
          # another node invocation.
          while IFS= read -r j; do
            if ! jq empty "${j}" 2>/dev/null; then
              echo "::error::${j} is not valid JSON. The page cannot render text in that" \
                   "language at all."
              failed=1
            fi
          done < <(find "${dir}/i18n" -type f -name '*.json')

          if [[ "${failed}" == 0 ]]; then
            echo "The ONE Tasks page is complete, parses, and every specifier resolves."
          fi
          exit "${failed}"

      - name: Every ONE document is on the one list
        shell: bash
        run: |
          set -euo pipefail

          # BRA-1475 criterion 18: one list of allowed pages exists in one
          # place, and a build fails when something reachable is not on it.
          #
          # The list is the const block at the top of pkg/routes/static_brazn.go,
          # and it is the server's own rather than a description of it:
          # braznBlocksAppShell serves an .html under dist/one/ only when that
          # block names it, so the block decides what is reachable. This step is
          # the other half. It fails the build when the block and the documents
          # that were actually written disagree, in either direction, and the
          # two directions catch different mistakes:
          #
          #   a page in the directory and not in the block  a document somebody
          #     added and nobody decided to serve. It answers 404 in production
          #     and nothing else in this repository would ever say so.
          #   a document in the block and not in the directory  the lockout
          #     answering a customer's address with a page that was never
          #     written. That is the shape of the fault BRA-1475 exists to fix,
          #     arriving from the other side.
          #
          # Vite copies frontend/public/ into dist/ verbatim (no publicDir
          # override in frontend/vite.config.ts) and frontend/embed.go embeds
          # dist/, so an .html in that directory is an .html in the binary.
          #
          # Scope note, matching the one on the section above: this step reads
          # pkg/routes/static_brazn.go and frontend/public/one and never .github/,
          # so it cannot match its own search terms and needs no exclusion.
          source=pkg/routes/static_brazn.go
          dir=frontend/public/one

          for required in "${source}" "${dir}"; do
            if [[ ! -e "${required}" ]]; then
              echo "::error::${required} is gone. The one list of documents lives in the" \
                   "first and the documents themselves in the second, so this guard can" \
                   "verify neither. Re-point it before merging."
              exit 1
            fi
          done

          # The block writes each document as a backticked /one/*.html literal,
          # and its own comment forbids writing one anywhere else in that file.
          # An extraction that finds nothing is a finding rather than a pass: a
          # pattern that quietly stopped matching would otherwise report an
          # empty list agreeing with an empty list, which is the
          # glob-that-matches-nothing failure the step above is also written
          # against.
          listed="$(grep -oE '`/one/[A-Za-z0-9._-]+\.html`' "${source}" \
            | tr -d '`' | sed 's|^/one/||' | sort -u)"
          if [[ -z "${listed}" ]]; then
            echo "::error::No document literals were found in ${source}. The const block" \
                 "naming them has moved or changed shape, so this guard is checking" \
                 "nothing at all. Re-point it before merging."
            exit 1
          fi

          present="$(find "${dir}" -maxdepth 1 -type f -name '*.html' -exec basename {} \; | sort -u)"

          failed=0

          while IFS= read -r page; do
            if [[ -z "${page}" ]]; then continue; fi
            echo "::error::${dir}/${page} is embedded in the binary and served to anyone" \
                 "who asks for it by name, and no document in ${source} names it. Add it" \
                 "to the const block there, or delete the page."
            failed=1
          done < <(comm -13 <(echo "${listed}") <(echo "${present}"))

          while IFS= read -r doc; do
            if [[ -z "${doc}" ]]; then continue; fi
            echo "::error::${source} names /one/${doc} as a document this product serves," \
                 "and ${dir}/${doc} does not exist. The lockout answers an address with a" \
                 "page nobody wrote, so a customer arriving there gets a 404."
            failed=1
          done < <(comm -23 <(echo "${listed}") <(echo "${present}"))

          # ------------------------------------------------------------------
          # THE BASE TAG, and it is the seam where the two halves of BRA-1475
          # touch. A document the lockout hands back AT AN ADDRESS THAT IS NOT
          # ITS OWN must carry <base href="/one/">, because every reference in
          # it is written relative to the directory it lives in.
          #
          # What a customer sees without it: the password document is served at
          # tasks.brazn.one/?userPasswordReset=<token>, so ./one.css resolves to
          # /one.css and ./password.js to /password.js, and neither exists. The
          # body of that document is one empty container built entirely in
          # JavaScript, and its markup hides the container until the module
          # loads — sound reasoning in general, and here it removes the last
          # visible symptom. The person clicking the reset link in their mail
          # gets A BLANK WHITE PAGE. Not a degraded page: an empty one.
          #
          # NOTHING ELSE IN THIS REPOSITORY WOULD REPORT IT, which is what makes
          # it worth a guard rather than a comment. The frontend tests import
          # the page modules and stand window.location at an address; they never
          # load the document. The markup check in the step above resolves
          # ./one.css against the directory the files live in, which is how they
          # are authored, so it passes either way. The name check above compares
          # document names, not whether a document works where it is served. And
          # the Go routing tests assert that the document is served, which it
          # still would be.
          #
          # WHICH DOCUMENTS NEED IT IS DERIVED RATHER THAN LISTED. A second list
          # would drift from the serving decision the day somebody adds an
          # address, and this file already argues that a list which can drift
          # from the thing it describes is worse than no list. The set is
          # exactly what braznRestrictedUIDocument can return, so it is read out
          # of the two tables and the one function that decide it. The settings
          # and task documents are answered only at their own /one/ address, so
          # they are neither asked for the tag nor need it.
          served="$(awk '
            /^var restrictedUIRewrites =/ {inside=1}
            /^var restrictedUIMailedTokens =/ {inside=1}
            /^func braznRestrictedUIDocument\(/ {inside=1}
            inside {print}
            /^}$/ {inside=0}
          ' "${source}" | grep -oE 'restrictedUI[A-Za-z]*Page' | sort -u || true)"

          # An extraction that finds nothing is a finding, not a pass — the same
          # trap the document-name check above is written against. If the tables
          # are renamed or restructured this guard stops seeing them, and an
          # empty set would silently agree with everything.
          #
          # THE `|| true` ON EVERY EXTRACTION ABOVE AND BELOW IS LOAD-BEARING,
          # and leaving it off is how this test came to be run at all. Under
          # `set -euo pipefail` a command substitution whose grep matches
          # nothing exits non-zero and kills the script THERE, so the job goes
          # red having printed no ::error:: line at all — and the branch below
          # that exists to explain an empty extraction is never reached. A red
          # job with no annotation is the worst of both: it blocks, and it does
          # not say why.
          if [[ -z "${served}" ]]; then
            echo "::error::No document constant was found in ${source}'s serving tables." \
                 "restrictedUIRewrites, restrictedUIMailedTokens or braznRestrictedUIDocument" \
                 "has been renamed or restructured, so this guard no longer knows which" \
                 "documents are served away from /one/ and is checking nothing. Re-point it" \
                 "before merging."
            exit 1
          fi

          for name in ${served}; do
            path="$(grep -E "^[[:space:]]*${name}[[:space:]]*=" "${source}" \
              | grep -oE '/one/[A-Za-z0-9._-]+\.html' | head -1 || true)"
            if [[ -z "${path}" ]]; then
              echo "::error::${source} serves ${name} at an address outside /one/, and this" \
                   "guard cannot find which document that constant names. Re-point it before" \
                   "merging."
              failed=1
              continue
            fi

            page="${path#/one/}"
            # A document that does not exist is already reported above. Saying
            # it twice would bury the one error that names the real problem.
            if [[ ! -f "${dir}/${page}" ]]; then continue; fi

            # READ WITH HTML COMMENTS BLANKED OUT, because a tag inside one is
            # not a tag. Commenting the base out while chasing something else
            # and shipping it that way is a realistic accident, and a guard that
            # a commented-out tag satisfies is decorative — which is the defect
            # this whole step exists to stop, arriving in the step itself. The
            # awk below replaces comment spans with nothing while emitting one
            # line per input line, so the line numbers this check reports are
            # still the ones a person will find in the file.
            #
            # It matters for the ordering check too: these documents carry long
            # comment blocks in the head, and a relative reference quoted inside
            # one would otherwise be read as the first real reference. That
            # second reason is prospective rather than live: today's documents
            # quote their relative paths in backticks, which the ordering
            # pattern does not match. The first reason is live, and a mutation
            # proved it — a commented-out base tag satisfied this check before
            # the blanking was added.
            #
            # THE LIMIT, STATED IN THE FILE RATHER THAN ONLY IN A HANDOFF,
            # because a limit nobody can read is one somebody will later assume
            # away. THIS READS THE DOCUMENT AS TEXT AND DOES NOT PARSE IT. Comment
            # spans are understood and nothing else is, so a <base href="/one/">
            # written inside a JavaScript string, a <script> block or an
            # attribute value would satisfy this check without being a tag. An
            # HTML parser would close that, and it was judged not worth the job
            # budget: the accident this guard exists to catch is a tag deleted or
            # commented out, not a tag counterfeited in a string. Reconsider if a
            # document ever starts building its own head markup.
            visible="$(awk '
              {
                line = $0; out = ""
                while (length(line) > 0) {
                  if (incomment) {
                    i = index(line, "-->")
                    if (i == 0) { line = ""; break }
                    line = substr(line, i + 3); incomment = 0
                  } else {
                    i = index(line, "<!--")
                    if (i == 0) { out = out line; line = ""; break }
                    out = out substr(line, 1, i - 1); line = substr(line, i + 4); incomment = 1
                  }
                }
                print out
              }
            ' "${dir}/${page}")"

            base_line="$(printf '%s\n' "${visible}" \
              | grep -nE "<base[[:space:]][^>]*href=[\"']?/one/" \
              | head -1 | cut -d: -f1 || true)"
            if [[ -z "${base_line}" ]]; then
              echo "::error::${dir}/${page} carries no <base href=\"/one/\">, and the lockout" \
                   "serves it at an address outside /one/ (${name} in ${source}). Its" \
                   "stylesheet and its module resolve against the address the person asked" \
                   "for, where neither exists, so the page renders empty. Add the tag in the" \
                   "head, above the first relative reference. A relative base such as" \
                   "href=\"one/\" is the same fault: it must be root-absolute."
              failed=1
              continue
            fi

            # A base tag BELOW a reference does not affect that reference, so a
            # stylesheet above it still 404s. Present-but-too-late is the
            # decorative version of this guard's own subject.
            ref_line="$(printf '%s\n' "${visible}" \
              | grep -nE "(src|href)=[\"']\./" | head -1 | cut -d: -f1 || true)"
            if [[ -n "${ref_line}" ]] && (( base_line >= ref_line )); then
              echo "::error::${dir}/${page} has its <base> on line ${base_line}, below the" \
                   "relative reference on line ${ref_line}. A base tag only affects what" \
                   "comes after it, so that reference still resolves against the address the" \
                   "person asked for. Move the tag above it."
              failed=1
            fi
          done

          if [[ "${failed}" == 0 ]]; then
            echo "Every document named in ${source} exists in ${dir}, every page there is on" \
                 "the list, and every document served away from /one/ carries its base tag."
          fi
          exit "${failed}"

      - name: The ONE Tasks page loads nothing from another origin
        shell: bash
        run: |
          set -euo pipefail

          # The page authenticates with the session cookie this fork already
          # sets, and the commercial /v1 service sends no CORS headers at all,
          # so same-origin is not a preference here -- it is the only
          # configuration in which the page works. One absolute URL in a src=, a
          # font @import or a fetch() and that request goes out uncredentialed
          # and comes back looking like a permission error.
          dir=frontend/public/one
          if [[ ! -d "${dir}" ]]; then
            echo "::error::${dir} is gone. Re-point this guard before merging."
            exit 1
          fi

          # One exemption, and it is not a network reference: the SVG namespace
          # identifier, which is a constant the browser never fetches. Nothing
          # under frontend/src carries a licence header, so these files carry
          # none either and there is no gnu.org URL to allow. An <a> to a
          # documentation page would be a navigation rather than a subresource,
          # but its href belongs in a catalogue value rather than in markup --
          # so anchors get no exemption here on purpose.
          allowed='http://www\.w3\.org/2000/svg'

          # THE `//` IS REQUIRED, and matching a bare `https?:` instead is wrong.
          # An origin needs the authority component; without it there is nothing
          # to be cross-origin to. A bare scheme match also hits ordinary prose:
          # a source citation of the form `client-http-27c95232:2856` names no
          # host at all, and an earlier spelling of that same citation carried a
          # bare `http:` and failed this step on its first run.
          # Protocol-relative subresources are still caught by the second
          # alternative below.
          offenders="$(grep -rnE 'https?://|(src|href)=["'\'']?//' \
            --include='*.js' --include='*.html' --include='*.json' \
            "${dir}" | grep -vE "${allowed}" || true)"
          if [[ -n "${offenders}" ]]; then
            echo "${offenders}"
            echo "::error::The line(s) above name another origin. This page is served from" \
                 "the same origin as both APIs and sends credentials on every request; a" \
                 "cross-origin subresource is sent without them, and the commercial /v1" \
                 "service answers no CORS preflight. Address it relative to" \
                 "import.meta.url instead."
            exit 1
          fi
          echo "Every reference under ${dir} is same-origin."

      - name: Every i18n key the ONE Tasks page uses exists in its catalogue
        shell: bash
        run: |
          set -euo pipefail

          # No user-facing string on this page is hardcoded; every one goes
          # through t(). t() falls back to the requested language, then to en,
          # then to the key path itself -- so a key that exists nowhere does not
          # throw, it renders "one.settings.deleteAccount.cancel" into the
          # button a customer is looking at. That degrades only at runtime, on a
          # page no browser-driven job ever opens, which is precisely the silent
          # failure CLAUDE.md section 4 exists to stop. This step is what turns
          # it into a build failure.
          dir=frontend/public/one
          en="${dir}/i18n/en.json"
          if [[ ! -f "${en}" ]]; then
            echo "::error::${en} is gone. It is the page's hard i18n dependency -- not a" \
                 "fallback but the last resort every other language resolves through." \
                 "Re-point this guard before merging."
            exit 1
          fi

          failed=0

          # The namespaces come from en.json itself rather than a hardcoded
          # list, so adding a namespace does not silently narrow the sweep.
          # Anchoring to them is what keeps this free of false positives: a
          # quoted string like "en.json" or "logo-light.v1.png" matches the
          # dotted-path grammar but not a namespace, so it is never treated as
          # a key.
          ns="$(jq -r 'keys[]' "${en}" | paste -sd'|' -)"
          if [[ -z "${ns}" ]]; then
            echo "::error::${en} declares no top-level namespaces. Either it is empty or it" \
                 "is not the catalogue this guard expects."
            exit 1
          fi

          # Deliberately a sweep of every complete quoted string in the page's
          # own sources, not just the literal arguments of t(). Keys reach t()
          # here through const tables, ternary arms, refusal objects built in
          # api.js and data-i18n attributes in task.html -- extracting only
          # t('...') call sites would check roughly half of them and report
          # success for the rest. Requiring a quote at both ends is what
          # excludes property-access chains like state.organization.teams and
          # prose in comments.
          keys="$(grep -rhoE "[\"'\`](${ns})\.[A-Za-z0-9_]+(\.[A-Za-z0-9_]+)*[\"'\`]" \
            --include='*.js' --include='*.html' "${dir}" \
            | sed -E 's/^.(.*).$/\1/' | sort -u || true)"

          # The sweep is deliberately broad, so it needs two exclusions or it
          # reports things that are not keys. Both are properties of the key
          # vocabulary rather than a list of offenders, so neither needs
          # maintaining as the page grows:
          #   - a trailing file extension: "task.html" and "settings.html" are
          #     filenames the page references, and they match the `task`
          #     namespace without being keys.
          #   - a capitalised segment: every key in en.json is lowerCamelCase
          #     throughout, so "user.User" and "user.GetUserByID" -- Go type and
          #     method names quoted in comments and error paths -- match the
          #     `user` namespace without being keys either.
          keys="$(echo "${keys}" \
            | grep -vE '\.(html|js|json|css|png|ico|svg|webmanifest)$' \
            | grep -vE '(^|\.)[A-Z]' || true)"

          while IFS= read -r key; do
            # A here-string over an empty variable still yields one empty line.
            if [[ -z "${key}" ]]; then continue; fi
            if ! jq -e --arg k "${key}" \
                 'getpath($k | split(".")) | strings | length > 0' "${en}" >/dev/null 2>&1; then
              echo "::error::i18n key '${key}' is used by the page but resolves to no" \
                   "non-empty string in ${en}. t() would render the key path itself to a" \
                   "customer. Add it under the one.* namespace in" \
                   "frontend/src/i18n/lang/en.json and in this trimmed catalogue, or fix" \
                   "the call site."
              failed=1
            fi
          done <<< "${keys}"

          # Template literals build a key from a static prefix and a runtime
          # value -- t(`task.relation.kinds.${kind}`). The individual leaves
          # cannot be enumerated from source, but the parent must at least exist
          # as an object; if the whole family has been renamed away, every one
          # of those calls renders a raw key path.
          prefixes="$(grep -rhoE "\`(${ns})\.[A-Za-z0-9_.]*\\\$\{" \
            --include='*.js' "${dir}" \
            | sed -E 's/^.//; s/\.?\$\{$//' | sort -u || true)"

          while IFS= read -r prefix; do
            if [[ -z "${prefix}" ]]; then continue; fi
            if ! jq -e --arg k "${prefix}" \
                 'getpath($k | split(".")) | objects | length > 0' "${en}" >/dev/null 2>&1; then
              echo "::error::The page builds i18n keys under '${prefix}.*', but that is not" \
                   "a non-empty object in ${en}. Every key built from that prefix renders" \
                   "as its own path."
              failed=1
            fi
          done <<< "${prefixes}"

          if [[ "${failed}" == 0 ]]; then
            echo "Every i18n key and key prefix the page uses resolves in ${en}."
          fi
          exit "${failed}"

      - name: The ONE Tasks page does not call the product by an old name
        shell: bash
        run: |
          set -euo pipefail

          # The catalogue step above walks pkg/i18n/lang and
          # frontend/src/i18n/lang. The page ships its own trimmed catalogues
          # under frontend/public/one/i18n, which that loop does not reach, and
          # its markup carries product copy that no catalogue holds at all. 71
          # of the prototype's 82 "Vikunja" strings were removed on the way in;
          # this is what reports the 72nd arriving.
          dir=frontend/public/one
          if [[ ! -d "${dir}" ]]; then
            echo "::error::${dir} is gone. Re-point this guard before merging."
            exit 1
          fi

          failed=0

          # Catalogues: values only, exactly like the frontend/src/i18n/lang
          # loop above and for the same reason. A key is an identifier wired to
          # a call site; only a value is something a customer can read.
          #
          # The superseded product and subscription names are refused here as well
          # (BRA-1444), on the same reasoning as the loop above.
          #
          # This used to cover the page's catalogues only, and deliberately not
          # its markup and code below, because the contract notes under
          # frontend/public/one cited the service bundles they were read from by
          # their private-repository filenames 119 times, and scanning the code
          # for the assistant's name would have red-failed every one of them.
          # BRA-1414 rewrote those citations to carry the bundle's build hash
          # and no source path, so the exemption has nothing left to protect and
          # the code scan below now covers the name too. That matters more than
          # the tidiness: the .d.ts files in this directory are served as plain
          # text to anyone who asks for one by name, so a private source path in
          # a comment there is fetchable over the web.
          # Three greps for the same reason as the loop above: an allowance on a
          # shared line drops that line for every name on it, and the dead names
          # must not be droppable by the allowance the assistant's name will one
          # day carry.
          upstream="$(grep -rnE '":.*[Vv]ikunja' "${dir}/i18n" | grep -vF 'Vikunja export' || true)"
          superseded="$(grep -rnE '":.*([Bb]razn [Tt]asks|[Pp]ercy [Cc]loud|[Bb]razn [Cc]loud)' "${dir}/i18n" || true)"
          assistant="$(grep -rnE '":.*[Pp]ercy' "${dir}/i18n" | grep -viF 'percy cloud' || true)"
          hits="$(printf '%s\n%s\n%s' "${upstream}" "${superseded}" "${assistant}" | grep -v '^$' || true)"
          if [[ -n "${hits}" ]]; then
            echo "${hits}"
            failed=1
          fi

          # Markup and code carry no keys to protect, but they are not
          # unconditional either -- two mentions are required to be there:
          #
          #   X-Vikunja-Format  the literal request header spelled by the fork's
          #     API. It is a wire identifier, not product copy; renaming it in
          #     our source would simply stop the description round-tripping as
          #     markdown.
          #   mirrored from frontend/src/styles  the provenance comment on the
          #     design-token subset copied out of the upstream stylesheet, which
          #     CLAUDE.md section 7 requires us to keep for AGPL attribution.
          #
          # Without this allowlist the guard red-fails on both, which is how a
          # correct check gets deleted rather than fixed. Same shape and same
          # reasoning as the swagger allowlist above.
          allowed='X-Vikunja-Format|mirrored from frontend/src/styles|based on Vikunja'

          # *.ts is included because the three hand-written .d.ts files are
          # copied into dist/ and embedded in the binary exactly like the rest
          # of this directory -- inert, but shipped, and served as text/plain to
          # anyone who asks for one by name.
          offenders="$(grep -rIoiE '.{0,60}vikunja.{0,60}' \
            --include='*.html' --include='*.js' --include='*.ts' "${dir}" \
            | grep -viE "${allowed}" || true)"
          if [[ -n "${offenders}" ]]; then
            echo "${offenders}"
            failed=1
          fi

          # The assistant's name, in the same files and with no allowlist. It
          # gets its own grep rather than joining the alternation above so that
          # the Vikunja allowlist -- which admits a wire header and an
          # attribution comment -- can never be widened into an allowance for
          # this one by accident. There is no legitimate mention here: this
          # directory is the restricted interface a customer downloads, the
          # product is ONE everywhere they can see it, and the source citations
          # that used to make this scan impossible were rewritten by BRA-1414.
          assistant="$(grep -rIoiE '.{0,60}percy.{0,60}' \
            --include='*.html' --include='*.js' --include='*.ts' "${dir}" || true)"
          if [[ -n "${assistant}" ]]; then
            echo "${assistant}"
            failed=1
          fi

          if [[ "${failed}" != 0 ]]; then
            echo "::error::The text above names Vikunja, Brazn Tasks or Percy, or the" \
                 "subscription Percy Cloud or Brazn Cloud, on a customer-facing page." \
                 "This product is ONE everywhere a customer can see, and what a customer" \
                 "buys is \"your ONE subscription\" (BRA-1444, CLAUDE.md section 7);" \
                 "upstream attribution lives in NOTICE.md and the About page, not here." \
                 "If a mention is genuinely required -- a wire identifier or an" \
                 "attribution comment -- add it to this step's allowlist deliberately" \
                 "rather than deleting the check."
            exit 1
          fi
          echo "Nothing under ${dir} names the product by an old name outside the allowlist."
