name: Brand assets

# Derives pkg/notifications/logo.png -- the image attached inline to every
# non-conversational notification mail -- from the committed source artwork.
#
# Why it runs here and not on a developer machine: no agent on this project may
# run image tooling on the Windows host. The recorded blue screen of 2026-07-22
# was in the graphics driver (dxgmms2.sys), and image processing is the one
# class of work that touches that path (CLAUDE.md section 1). Ubuntu runners
# ship ImageMagick, so the conversion happens on one and the result is committed
# back to the branch that triggered it.
#
# The path filter includes the derived asset itself. Hand-edit
# pkg/notifications/logo.png and this job runs, regenerates it from the source,
# and commits over the edit -- the shipped asset self-heals rather than drifting
# away from the artwork it is supposed to come from. On brazn/main it cannot
# push to a protected branch, so it fails and names what is out of date instead.
#
# Note that a push made with GITHUB_TOKEN deliberately does not trigger further
# workflow runs, so `ci` does not re-run on the commit this job creates. Re-run
# `ci` on the new head before merging a pull request that this job has written
# to (BRA-990).

on:
  workflow_dispatch:
  push:
    paths:
      - docs/brand/one-wordmark-source.png
      - pkg/notifications/logo.png
      - .github/workflows/brand-assets.yml

permissions:
  contents: write

concurrency:
  group: brand-assets-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE: docs/brand/one-wordmark-source.png
  DERIVED: pkg/notifications/logo.png
  # Final width. mailTemplateHTML renders the image at width:138px, so this
  # is 2x for high-density displays (BRA-1374).
  TARGET_WIDTH: 276
  # BRA-830's acceptance criterion is that notification mail reaches a
  # mainstream inbox rather than a spam folder, and this file is attached to
  # every one of them. Upstream's logo was 7 KB.
  MAX_BYTES: 30720

jobs:
  derive:
    name: Derive notification-email logo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install ImageMagick if the runner image does not ship it
        run: |
          set -euo pipefail
          if command -v magick >/dev/null 2>&1 || command -v convert >/dev/null 2>&1; then
            echo "ImageMagick is already present."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick

      - name: Derive the logo from the source artwork
        run: |
          set -euo pipefail

          if command -v magick >/dev/null 2>&1; then
            im()       { magick "$@"; }
            im_ident() { magick identify "$@"; }
          else
            im()       { convert "$@"; }
            im_ident() { identify "$@"; }
          fi

          echo "::group::Source artwork"
          im_ident -format 'geometry=%wx%h depth=%z colorspace=%[colorspace] alpha=%A channels=%[channels]\n' "$SOURCE"
          echo "bytes: $(stat -c%s "$SOURCE")"
          echo "::endgroup::"

          # The source (BRA-1374) carries a real alpha channel -- unlike the
          # interim Percy wordmark this replaced, whose glow faded
          # continuously into an opaque background with nothing to key out.
          # No trim step here: the source SVG's own viewBox is exactly 3:2
          # (BRA-1374 -- "three units wide to two tall") with the wordmark's
          # vertical breathing room baked into that viewBox as a deliberate
          # part of the composition, not incidental canvas. `-trim` reads
          # that margin as empty space and crops it away, which is what
          # produced a visibly squashed, wrong-aspect logo the first time
          # this ran -- 276x99 instead of the spec's 276x184. Resize directly
          # from the source and its own aspect ratio survives unmodified.
          #
          # -define png:color-type=6 is what keeps the alpha channel through
          # quantization: without it ImageMagick is free to flatten to a
          # palette PNG whose single transparent index cannot represent the
          # gradient's own antialiased edges. The colour-count loop stays
          # regardless, guarding the file-size ceiling below should the
          # gradient ever grow more colour stops than fit a small palette.
          for COLORS in 256 128 64; do
            im "$SOURCE" \
              -resize "${TARGET_WIDTH}x" \
              -strip \
              -dither None -colors "$COLORS" \
              -define png:color-type=6 \
              -define png:compression-level=9 \
              -define png:compression-filter=5 \
              -define png:compression-strategy=1 \
              "$DERIVED"
            echo "colors=${COLORS} -> $(im_ident -format '%wx%h' "$DERIVED"), $(stat -c%s "$DERIVED") bytes"
            if [ "$(stat -c%s "$DERIVED")" -le "$MAX_BYTES" ]; then
              break
            fi
          done

          WIDTH=$(im_ident -format '%w' "$DERIVED")
          HEIGHT=$(im_ident -format '%h' "$DERIVED")
          SIZE=$(stat -c%s "$DERIVED")
          ALPHA=$(im_ident -format '%A' "$DERIVED")

          if [ "$WIDTH" -ne "$TARGET_WIDTH" ]; then
            echo "::error::derived logo is ${WIDTH}px wide, expected ${TARGET_WIDTH}px"
            exit 1
          fi
          # The mark is three units wide to two tall (BRA-1374): at 138px
          # wide it stands 92px tall, so at TARGET_WIDTH (2x, for
          # high-density screens) it must stand at TARGET_WIDTH*2/3. This is
          # the exact regression a `-trim` step once introduced silently --
          # 276x99 shipped instead of 276x184 -- so pin it rather than only
          # checking width.
          EXPECTED_HEIGHT=$((TARGET_WIDTH * 2 / 3))
          if [ "$HEIGHT" -ne "$EXPECTED_HEIGHT" ]; then
            echo "::error::derived logo is ${HEIGHT}px tall, expected ${EXPECTED_HEIGHT}px (3:2 aspect at ${TARGET_WIDTH}px wide)"
            exit 1
          fi
          if [ "$SIZE" -gt "$MAX_BYTES" ]; then
            echo "::error::derived logo is ${SIZE} bytes, ceiling is ${MAX_BYTES}"
            exit 1
          fi
          if [ "$ALPHA" != "True" ] && [ "$ALPHA" != "true" ] && [ "$ALPHA" != "Blend" ]; then
            echo "::error::derived logo lost its alpha channel (reports alpha=${ALPHA}) -- it would render as a solid box on the mail's background"
            exit 1
          fi

          {
            echo "### Derived \`${DERIVED}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| geometry | ${WIDTH} x ${HEIGHT} |"
            echo "| size | ${SIZE} bytes (ceiling ${MAX_BYTES}) |"
            echo "| alpha | ${ALPHA} |"
            echo "| source | \`${SOURCE}\`, $(stat -c%s "$SOURCE") bytes |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the derived asset
        run: |
          set -euo pipefail

          if git diff --quiet -- "$DERIVED"; then
            echo "${DERIVED} already matches what ${SOURCE} derives to. Nothing to commit."
            exit 0
          fi

          git --no-pager diff --stat -- "$DERIVED"

          if [ "$GITHUB_REF_NAME" = "brazn/main" ]; then
            echo "::error::${DERIVED} does not match what ${SOURCE} derives to, and this job cannot push to a protected branch. Re-derive it on a branch and open a pull request."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DERIVED"
          git commit \
            -m "chore(brand): derive the notification-email logo from the ONE wordmark (BRA-1374)" \
            -m "Generated by .github/workflows/brand-assets.yml from ${SOURCE}. Not edited by hand: editing it re-triggers that workflow, which regenerates the file over the edit."
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
