# Package identity is ours; the install paths below deliberately are not. The
# binary, config directory and service unit keep their upstream names so that
# existing deployments and the release tooling that references those paths keep
# working — this ticket changes what a user sees, not where files live.
name: "brazn-tasks"
arch: "<arch>"
platform: "linux"
version: "<version>"
description: "Brazn Tasks is an open-source todo application, written in Go. It lets you create lists,tasks and share them via teams or directly between users. Brazn Tasks is a modified fork of Vikunja and is not affiliated with or endorsed by the Vikunja project."
maintainer: "Brazn Mngo <hello@braznmngo.com>"
homepage: "https://github.com/BraznMngo/brazn-tasks"
section: "default"
priority: "extra"
license: "AGPLv3"
depends:
  - systemd
rpm:
  signature:
    key_file: ${NFPM_GPG_KEY_FILE}
overrides:
  apk:
    depends:
      - openrc
    scripts:
      postinstall: ./build/after-install-openrc.sh
contents:
  - src: <binlocation>
    dst: /opt/vikunja/vikunja
  - src: ./config.yml.sample
    dst: /etc/vikunja/config.yml
    type: "config"
  - src: /opt/vikunja/vikunja
    dst: /usr/local/bin/vikunja
    type: "symlink"
  - src: vikunja.service
    dst: /usr/lib/systemd/system/vikunja.service
  - src: vikunja.initd
    dst: /etc/init.d/vikunja
    type: "config"
    packager: apk
scripts:
  postinstall: ./build/after-install.sh
