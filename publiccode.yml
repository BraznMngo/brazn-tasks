publiccode-yml-version: '0.2'
name: 'Brazn Tasks'
url: 'https://github.com/BraznMngo/brazn-tasks'
landingURL: 'https://github.com/BraznMngo/brazn-tasks'
# isBasedOn is the publiccode field for "this is a fork of": upstream had it
# pointing at go.dev, which is not what the field means. Pointing it at Vikunja
# is both correct and part of stating that this is a modified fork.
isBasedOn: 'https://github.com/go-vikunja/vikunja'
softwareVersion: 'v2.4.0'
releaseDate: '2026-07-19'
# logo: intentionally absent until a Brazn Tasks mark exists. The upstream value
# pointed at the Vikunja logo, which is not licensed to this fork.
platforms:
  - 'web'
  - 'linux'
  - 'windows'
  - 'mac'
  - 'lxc'
  - 'docker'
  - 'k8s'
  - 'debian'
categories:
  - 'agile-project-management'
  - 'enterprise-project-management'
  - 'project-management'
  - 'task-management'
  - 'workflow-management'
# usedBy and roadmap dropped: both listed upstream's adopters and upstream's
# roadmap, neither of which this fork may claim as its own.
developmentStatus: 'stable'
softwareType: 'standalone/web'
intendedAudience:
  scope:
    - 'Providers of standard based workflow management services who wish or are required to use Open Source solutions'
description:
  en: 'The open-source, self-hostable to-do app. Organize everything, on all platforms. Brazn Tasks is a modified fork of Vikunja v2.4.0 and is not affiliated with, endorsed by, or a product of the Vikunja project.'
documentation: 'https://github.com/BraznMngo/brazn-tasks#readme'
features:
  - 'workflow management'
  - 'CalDAV provider'
  - 'kanban tool'
  - 'gantt display tool'
  - 'ticket system'
# screenshots dropped: the upstream entry pointed at Vikunja-branded imagery.
videos:
  - 'none'
legal:
  license: 'GNU AFFERO GENERAL PUBLIC LICENSE Version 3'
  # mainCopyrightOwner and authorsFile stay pointed at upstream: the copyright in
  # the overwhelming majority of this code is theirs and must not be reassigned.
  # Only repoOwner changes, because this repository is genuinely ours.
  mainCopyrightOwner: 'Konrad Langenberg Software'
  repoOwner: 'Brazn Mngo'
  authorsFile: 'hello@vikunja.io'
maintenance:
  # publiccode v0.2 makes `contacts` mandatory when type is `internal`; dropping
  # the upstream `contractors` block without adding this left the file invalid.
  type: 'internal'
  contacts:
    - name: 'Brazn Mngo'
      email: 'hello@braznmngo.com'
localisation:
  localisationReady: 'true'
  availableLanguages:
    - 'en'
    - 'de-de'
    - 'ru-ru'
    - 'fr-fr'
    - 'vi-vn'
    - 'it-it'
    - 'cs-cz'
    - 'pl-pl'
    - 'nl-nl'
    - 'pt-pt'
    - 'zh-cn'
    - 'no-no'
    - 'es-es'
    - 'da-dk'
    - 'ja-jp'
    - 'hu-hu'
    - 'sl-si'
dependsOn:
  open:
    - name: 'CalDAV'
    - name: 'GoLANG'
    - name: 'Vue.js'
    - name: 'HTTP-Proxy'
    - name: 'SSL'
    - name: 'Unit file (SystemD)'
    - name: 'Firewall Rules (Web: 443)'
